[package]
name = "gemini-desk"
version = "0.2.0"
edition = "2024"
description = "Lightweight, high-performance unofficial Rust desktop client for Google Gemini"
license = "MIT OR Apache-2.0"

[dependencies]
directories = "6.0"
global-hotkey = "0.10"
muda = "0.21"
open = "5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tao = "0.37"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.26"
url = "2.5"
wry = "0.57"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
